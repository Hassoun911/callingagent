name: Sequential Extension Build Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/sequential-extensions]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/call-center build
        env:
          PORT: "3000"
