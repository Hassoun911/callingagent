name: Phone Rec Bridge Check

on:
  push:
    branches: [ main ]
    paths:
      - 'artifacts/api-server/**'
      - 'lib/db/**'
      - 'scripts/apply-phone-rec-bridge.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/phone-rec-bridge-check.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies for typecheck
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply Phone Rec bridge
        run: node scripts/apply-phone-rec-bridge.mjs
      - name: Typecheck
        run: pnpm run typecheck
