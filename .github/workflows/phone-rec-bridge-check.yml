name: Phone Rec Bridge Check

on:
  push:
    branches: [ main ]
    paths:
      - 'artifacts/api-server/**'
      - 'lib/db/**'
      - 'scripts/apply-phone-rec-bridge.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/phone-rec-bridge-check.yml'
  workflow_dispatch:

jobs:
  bridge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build CallingAgent API with Phone Rec bridge
        run: pnpm --filter @workspace/api-server run build
      - name: Verify bundled Phone Rec bridge
        run: |
          grep -q 'Phone Rec AI rule synchronized' artifacts/api-server/dist/index.mjs
          grep -q 'PHONE REC CALLER RULE' artifacts/api-server/dist/index.mjs
          grep -q 'phone-rec/status' artifacts/api-server/dist/index.mjs
